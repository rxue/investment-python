name: Watch List Email

on:
  schedule:
    # 22:00 UTC, Mon-Fri (after US market close)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

jobs:
  run-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run watch list
        run: |
          uv run investment metrics PRICE,PRICE_IN_EURO,TRAILING_PE,RETURN_ON_EQUITY,PRICE_TO_BOOK,DIVIDEND_YIELD --company-csv https://gist.githubusercontent.com/rxue/7ec0914a8af1525d97e8dfd2ac5d61d7/raw/6d2ebe612d46170f452694b6682b29bfe5dadec6/companies.csv --price-ranges PFE:28:29.5,FIA1S.HE:4.5:5.5,ELISA.HE:34.6:36.5,PDD:80:92,GIS:35:50,STZ:129:145 --output-csv-name watch_list_output.csv

      - name: Determine prices attachments
        id: prices_attachments
        run: |
          attachments="watch_list_output.csv"
          if [ -f companies_with_error.csv ]; then
            attachments="$attachments,companies_with_error.csv"
          fi
          echo "list=$attachments" >> "$GITHUB_OUTPUT"

      - name: Send all prices to mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.MAIL_TO }}
          subject: "Stock Market Quotes Watch List - ${{ github.run_id }}"
          body: Watch List output in the attachment
          attachments: ${{ steps.prices_attachments.outputs.list }}

      - name: Check if alert file exists
        id: check_alert_file
        run: |
          if [ -f alert_on_companies.csv ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send all price alert to mail
        if: steps.check_alert_file.outputs.exists == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.MAIL_TO }}
          subject: "Price Alert - ${{ github.run_id }}"
          body: Alert on stocks out of its safe price range output in the attachment
          attachments: alert_on_companies.csv
