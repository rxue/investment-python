name: Watch List Email

on:
  schedule:
    # 22:00 UTC, Mon-Fri (after US market close)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

jobs:
  run-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run watch list
        run: |
          uv run investment metrics PRICE,PRICE_IN_EURO,TRAILING_PE,RETURN_ON_EQUITY,PRICE_TO_BOOK,DIVIDEND_YIELD --company-csv https://gist.githubusercontent.com/rxue/7ec0914a8af1525d97e8dfd2ac5d61d7/raw/6d2ebe612d46170f452694b6682b29bfe5dadec6/companies.csv --output-csv-name watch_list_output.csv

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.MAIL_TO }}
          subject: "Stock Market Quotes Watch List - ${{ github.run_id }}"
          body: Watch List output in the attachment
          attachments: watch_list_output.csv
